<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Focused Ultrasound Visualiser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- Left: frequency control -->
  <div id="freq-panel">
    <div id="freq-title">Frequency</div>
    <div id="freq-track-wrap">
      <div id="freq-track"></div>
      <div id="freq-thumb"></div>
    </div>
    <div id="freq-speaker" title="Click to play beep">
      <img data-icon="freqSpeaker" alt="" draggable="false" />
    </div>
    <div id="freq-label">800 Hz</div>
    <div id="freq-sublabel">drag · click for beep</div>
  </div>

  <!-- Main: array + wave field -->
  <div id="main-panel">
    <canvas id="wave-canvas"></canvas>

    <div id="count">
      <button id="btn-minus" aria-label="Fewer speakers">−</button>
      <span id="count-label">8 speakers</span>
      <button id="btn-plus" aria-label="More speakers">+</button>
    </div>

    <div id="speakers-layer"></div>

    <div id="mic">
      <img data-icon="microphone" alt="" draggable="false" />
    </div>

    <button id="play" aria-label="Play all">
      <img data-icon="play" alt="" draggable="false" />
    </button>
    <div id="play-hint">press space</div>

    <div id="controls">
      <button class="btn" id="btn-random">Random</button>
      <button class="btn primary" id="btn-focus">Focus</button>
    </div>

    <div id="brand">
      <div class="logo">FUS FUN</div>
      <div class="info">
        red &amp; blue rings = wave peaks &amp; troughs<br>
        drag the microphone &nbsp;·&nbsp; click any speaker to fire it alone
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
